{% load static %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
document.addEventListener("DOMContentLoaded", function() {
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    const darkBtn = document.getElementById("darkToggle");
    const body = document.body;

    // 1. Fitur Hide/Mini Sidebar
    toggleBtn.addEventListener("click", () => {
        if (window.innerWidth < 768) {
            sidebar.classList.toggle("show"); // Untuk Mobile
        } else {
            sidebar.classList.toggle("mini"); // Untuk Desktop
        }
        
        // Ganti ikon toggle
        const icon = toggleBtn.querySelector("i");
        if (sidebar.classList.contains("mini")) {
            icon.classList.replace("bi-text-indent-left", "bi-text-indent-right");
        } else {
            icon.classList.replace("bi-text-indent-right", "bi-text-indent-left");
        }
    });

    // 2. Fitur Dark Mode yang Konsisten
    darkBtn.addEventListener("click", () => {
        body.classList.toggle("dark-mode");
        
        const darkIcon = darkBtn.querySelector("i");
        if (body.classList.contains("dark-mode")) {
            darkIcon.classList.replace("bi-moon-stars", "bi-sun");
            localStorage.setItem("theme", "dark");
        } else {
            darkIcon.classList.replace("bi-sun", "bi-moon-stars");
            localStorage.setItem("theme", "light");
        }
    });

    // 3. Simpan pilihan tema user di browser
    if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-mode");
        darkBtn.querySelector("i").classList.replace("bi-moon-stars", "bi-sun");
    }
});
</script>
