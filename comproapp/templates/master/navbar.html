{% load static %}
<header class="topbar d-flex align-items-center justify-content-between px-3">

    <div class="d-flex align-items-center gap-2">
        <button id="sidebarToggle" class="btn btn-light-custom border-0" title="Toggle Sidebar">
            <i class="bi bi-text-indent-left fs-4"></i>
        </button>
        
        <button id="darkToggle" class="btn btn-light-custom border-0" title="Toggle Theme">
            <i class="bi bi-moon-stars fs-5"></i>
        </button>
    </div>

    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle profile-link"
           data-bs-toggle="dropdown" aria-expanded="false">
            
            <div class="text-end me-2 d-none d-sm-block">
                <div class="fw-bold small text-dark profile-name">{{ user }}</div>
                <div class="text-muted" style="font-size: 10px; margin-top: -4px;">{{ user.email }}</div>
            </div>

            <img src="https://ui-avatars.com/api/?name=Admin&background=1a1a1a&color=fff"
                 width="35"
                 height="35"
                 class="rounded-circle border">
        </a>

        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
            <li class="px-3 py-2 d-sm-none">
                <span class="fw-bold d-block">{{ user }}</span>
                <small class="text-muted">{{ user.email }}</small>
            </li>
            <li class="d-sm-none"><hr class="dropdown-divider"></li>
            
            <li>
                <a class="dropdown-item py-2" href="#">
                    <i class="bi bi-person me-2"></i> Profil
                </a>
            </li>
            <li>
                <a class="dropdown-item py-2" href="#">
                    <i class="bi bi-gear me-2"></i> Pengaturan
                </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item text-danger py-2" href="{% url 'logout' %}">
                    <i class="bi bi-box-arrow-right me-2"></i> Keluar
                </a>
            </li>
        </ul>
    </div>

</header>

<style>
    /* CSS Tambahan khusus Navbar agar lebih rapi */
    .topbar {
        height: 70px;
        background: var(--topbar-bg);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        transition: var(--transition);
    }

    .btn-light-custom {
        background: transparent;
        color: var(--sidebar-color);
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: all 0.2s;
    }

    .btn-light-custom:hover {
        background: rgba(0,0,0,0.05);
        color: var(--primary-color);
    }

    /* Dark Mode Adjustment untuk Navbar */
    body.dark-mode .profile-name {
        color: #ffffff !important;
    }
    
    body.dark-mode .btn-light-custom {
        color: #cbd5e1;
    }

    body.dark-mode .btn-light-custom:hover {
        background: rgba(255,255,255,0.1);
    }

    .profile-link {
        padding: 5px 10px;
        border-radius: 10px;
        transition: background 0.2s;
    }

    .profile-link:hover {
        background: rgba(0,0,0,0.03);
    }
    
    body.dark-mode .profile-link:hover {
        background: rgba(255,255,255,0.05);
    }
</style>
